<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f3e9" />
    <title>VERSO Coffee — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
    <script>
      try {
        const session = JSON.parse(localStorage.getItem('verso_session') || 'null')
        if (!session || session.role !== 'admin') {
          window.location.replace('/shop-login.html?mode=signup')
        }
      } catch (error) {
        window.location.replace('/shop-login.html?mode=signup')
      }
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
